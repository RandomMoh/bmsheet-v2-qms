<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QMS — Scheduled Maintenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" type="image/x-icon" href="/qms_react/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}

body {
  font-family: 'Inter', system-ui, sans-serif;
  min-height: 100vh;
  background: #f0fdfa;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

/* Subtle teal mesh background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 70% 60% at 15% 10%, rgba(20,184,166,.12), transparent),
    radial-gradient(ellipse 60% 50% at 85% 90%, rgba(6,182,212,.10), transparent),
    radial-gradient(ellipse 50% 40% at 50% 50%, rgba(255,255,255,.6), transparent);
  z-index: 0;
}

/* Decorative circles */
.deco {
  position: fixed;
  border-radius: 50%;
  z-index: 0;
}
.deco-1 {
  width: 600px; height: 600px;
  top: -200px; right: -150px;
  background: radial-gradient(circle, rgba(20,184,166,.08), transparent 70%);
  animation: float1 18s ease-in-out infinite;
}
.deco-2 {
  width: 500px; height: 500px;
  bottom: -180px; left: -120px;
  background: radial-gradient(circle, rgba(6,182,212,.07), transparent 70%);
  animation: float2 22s ease-in-out infinite;
}
@keyframes float1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-30px,20px)} }
@keyframes float2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(20px,-25px)} }

/* Main wrap */
.wrap {
  position: relative;
  z-index: 1;
  width: 92%;
  max-width: 500px;
  text-align: center;
}

/* Logo / brand row */
.brand {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 40px;
}
.brand-logo {
  width: 36px; height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.brand-logo svg { width: 20px; height: 20px; color: #fff; }
.brand-name {
  font-size: 15px;
  font-weight: 700;
  color: #134e4a;
  letter-spacing: -.2px;
}
.brand-sep {
  width: 1px; height: 18px;
  background: #99f6e4;
}
.brand-tag {
  font-size: 12px;
  font-weight: 500;
  color: #5eead4;
  letter-spacing: .5px;
  text-transform: uppercase;
}

/* Card */
.card {
  background: #fff;
  border-radius: 28px;
  padding: 56px 44px;
  box-shadow:
    0 1px 0 rgba(20,184,166,.12),
    0 4px 6px rgba(15,118,110,.04),
    0 20px 60px rgba(15,118,110,.08),
    0 0 0 1px rgba(20,184,166,.06);
}

/* Icon */
.icon-wrap {
  width: 80px; height: 80px;
  margin: 0 auto 32px;
  border-radius: 24px;
  background: linear-gradient(145deg, #f0fdfa, #ccfbf1);
  border: 1.5px solid rgba(20,184,166,.2);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.icon-wrap::after {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 30px;
  border: 1.5px solid rgba(20,184,166,.08);
  animation: pulse-ring 3s ease-in-out infinite;
}
@keyframes pulse-ring {
  0%,100% { transform: scale(1); opacity: .5; }
  50%      { transform: scale(1.06); opacity: 1; }
}
.icon-wrap svg { width: 36px; height: 36px; color: #0d9488; }

/* Text */
h1 {
  font-size: 26px;
  font-weight: 800;
  color: #134e4a;
  letter-spacing: -.4px;
  margin-bottom: 14px;
  line-height: 1.2;
}
.sub {
  font-size: 15px;
  color: #5f7271;
  line-height: 1.75;
  margin-bottom: 36px;
  max-width: 360px;
  margin-left: auto;
  margin-right: auto;
}

/* Status pill */
.status {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 11px 22px;
  border-radius: 100px;
  background: #f0fdfa;
  border: 1.5px solid rgba(20,184,166,.25);
  font-size: 13.5px;
  font-weight: 600;
  color: #0d9488;
  box-shadow: 0 2px 8px rgba(20,184,166,.08);
}
.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #14b8a6;
  box-shadow: 0 0 0 3px rgba(20,184,166,.2);
  animation: blink 1.5s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

/* Footer */
.footer {
  margin-top: 36px;
  font-size: 12px;
  color: #99f6e4;
  font-weight: 500;
  letter-spacing: .3px;
}
</style>
</head>
<body>
<div class="deco deco-1"></div>
<div class="deco deco-2"></div>

<div class="wrap">
  <div class="brand">
    <div class="brand-logo">
      <img src="/qms_react/favicon.ico" alt="Benchmark Studio" style="width:22px;height:22px;object-fit:contain">
    </div>
    <span class="brand-name">Benchmark Studio</span>
    <div class="brand-sep"></div>
    <span class="brand-tag">QMS</span>
  </div>

  <div class="card">
    <div class="icon-wrap">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/>
      </svg>
    </div>
    <h1>Scheduled Security<br>Maintenance</h1>
    <p class="sub">The QMS portal is currently undergoing a planned security update. We are upgrading authentication protocols to ensure a safer experience for the entire team.</p>
    <div class="status">
      <div class="dot"></div>
      Maintenance in progress
    </div>
    <p class="footer">Expected to be back shortly</p>
  </div>
</div>
</body>
</html>
