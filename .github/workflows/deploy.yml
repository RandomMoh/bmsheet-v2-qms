name: Deploy QMS Pro to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Production Bundle
        run: npm run build

      - name: 🏷️ Update Deployment Version
        run: |
          VERSION=$(date +%s)
          echo "{\"version\": \"$VERSION\"}" > api/version.json

      - name: 🔑 Configure SSH Key
        env:
          CPANEL_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_KEY_B64: ${{ secrets.CPANEL_SSH_KEY_BASE64 }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
        run: |
          mkdir -p ~/.ssh
          python3 -c "
          import os, sys, re
          raw = os.environ.get('CPANEL_KEY_B64', '')
          if raw:
              import base64
              key = base64.b64decode(raw).decode('utf-8')
          else:
              key = os.environ.get('CPANEL_KEY', '')

          m = re.search(r'(-----BEGIN [^-]+-----)\s*(.*?)\s*(-----END [^-]+-----)', key, re.DOTALL)
          if m:
              header, body, footer = m.groups()
              body_clean = ''.join(body.split())
              wrapped = '\n'.join(body_clean[i:i+64] for i in range(0, len(body_clean), 64))
              key = f'{header}\n{wrapped}\n{footer}\n'

          key_path = os.path.expanduser('~/.ssh/cpanel_key')
          with open(key_path, 'w') as f:
              f.write(key)
          "
          chmod 600 ~/.ssh/cpanel_key
          ssh-keyscan -H "$CPANEL_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 🧪 Verify SSH Connection
        env:
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
        run: |
          ssh -i ~/.ssh/cpanel_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$CPANEL_USER@$CPANEL_HOST" "echo 'SSH Connection Successful!'"

      - name: 🚀 Sync API Backend to cPanel
        run: |
          rsync -avz -e "ssh -i ~/.ssh/cpanel_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            --exclude 'sessions' \
            --exclude 'sessions/' \
            --exclude '*.log' \
            --exclude '*.txt' \
            api/ ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:public_html/qms_react/api/

      - name: 🌐 Sync Frontend Assets to cPanel
        run: |
          rsync -avz -e "ssh -i ~/.ssh/cpanel_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            --exclude 'api' \
            --exclude 'api/' \
            --delete \
            dist/ ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:public_html/qms_react/
