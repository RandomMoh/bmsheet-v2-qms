name: Deploy QMS Pro to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Production Bundle
        run: npm run build

      - name: 🏷️ Update Deployment Version
        run: |
          VERSION=$(date +%s)
          echo "{\"version\": \"$VERSION\"}" > api/version.json

      - name: 🔑 Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/cpanel_key
          chmod 600 ~/.ssh/cpanel_key

      - name: 🚀 Sync API Backend to cPanel
        run: |
          rsync -avz -e "ssh -i ~/.ssh/cpanel_key -o StrictHostKeyChecking=no" \
            --exclude 'sessions' \
            --exclude 'sessions/' \
            --exclude '*.log' \
            --exclude '*.txt' \
            api/ ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:public_html/qms_react/api/

      - name: 🌐 Sync Frontend Assets to cPanel
        run: |
          rsync -avz -e "ssh -i ~/.ssh/cpanel_key -o StrictHostKeyChecking=no" \
            --exclude 'api' \
            --exclude 'api/' \
            --delete \
            dist/ ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:public_html/qms_react/
