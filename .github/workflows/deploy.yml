name: Deploy QMS Pro to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Production Bundle
        run: npm run build

      - name: 🏷️ Update Deployment Version
        run: |
          VERSION=$(date +%s)
          echo "{\"version\": \"$VERSION\"}" > api/version.json

      - name: 🔑 Configure SSH Key
        env:
          CPANEL_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_KEY_B64: ${{ secrets.CPANEL_SSH_KEY_BASE64 }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
        run: |
          mkdir -p ~/.ssh
          if [ -n "$CPANEL_KEY_B64" ]; then
            echo "$CPANEL_KEY_B64" | base64 -d > ~/.ssh/cpanel_key
          else
            printf "%s\n" "$CPANEL_KEY" | tr -d '\r' > ~/.ssh/cpanel_key
          fi
          echo "" >> ~/.ssh/cpanel_key
          chmod 600 ~/.ssh/cpanel_key
          ssh-keyscan -H "$CPANEL_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 🚀 Sync API Backend to cPanel
        run: |
          rsync -avz -e "ssh -i ~/.ssh/cpanel_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            --exclude 'sessions' \
            --exclude 'sessions/' \
            --exclude '*.log' \
            --exclude '*.txt' \
            api/ ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:public_html/qms_react/api/

      - name: 🌐 Sync Frontend Assets to cPanel
        run: |
          rsync -avz -e "ssh -i ~/.ssh/cpanel_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            --exclude 'api' \
            --exclude 'api/' \
            --delete \
            dist/ ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:public_html/qms_react/
