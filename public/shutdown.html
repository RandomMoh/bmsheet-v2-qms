<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — QMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --canvas:  #F7F6F3;
      --surface: #FFFFFF;
      --ink:     #111111;
      --mid:     #787774;
      --border:  rgba(0,0,0,0.08);
      --red:     #C8392B;
      --red-bg:  #FDF3F2;
    }

    html, body {
      background: var(--canvas);
      color: var(--ink);
      font-family: 'JetBrains Mono', 'SF Mono', monospace;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Layout shell ── */
    .shell {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100dvh;
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 48px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .topbar-brand {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .topbar-clock {
      font-size: 10px;
      letter-spacing: 0.06em;
      color: var(--mid);
      font-variant-numeric: tabular-nums;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--red-bg);
      border: 1px solid rgba(200,57,43,0.15);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--red);
    }

    /* Square status indicator — no blinking */
    .status-sq {
      width: 6px;
      height: 6px;
      background: var(--red);
      border-radius: 1px;
      flex-shrink: 0;
    }

    /* ── Main ── */
    main {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 32px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 56px 64px;
      max-width: 640px;
      width: 100%;
    }

    /* Label above heading */
    .eyebrow {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--mid);
      margin-bottom: 20px;
    }

    /* Main heading — large, tight */
    h1 {
      font-size: clamp(2rem, 5vw, 3.25rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.0;
      color: var(--ink);
      margin-bottom: 24px;
    }

    h1 .muted { color: var(--mid); }

    /* Hairline divider */
    .hr {
      height: 1px;
      background: var(--border);
      margin: 32px 0;
    }

    /* Body */
    p {
      font-size: 12px;
      line-height: 1.8;
      color: var(--mid);
      letter-spacing: 0.02em;
      margin-bottom: 40px;
      max-width: 42ch;
    }

    /* Data grid — 2 cols */
    .data-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 40px;
    }

    .data-cell {
      padding: 16px 20px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .data-cell:nth-child(even) { border-right: none; }
    .data-cell:nth-last-child(-n+2) { border-bottom: none; }

    .data-key {
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--mid);
      margin-bottom: 6px;
    }

    .data-val {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: 0.02em;
    }

    .data-val.offline { color: var(--red); }

    /* ── Footer ── */
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 40px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    footer span {
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--mid);
    }

    /* Dev terminal access — discreet */
    .dev-link {
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--border);
      text-decoration: none;
      transition: color 200ms cubic-bezier(0.23, 1, 0.32, 1);
      cursor: pointer;
    }

    .dev-link:hover { color: var(--mid); }

    /* ── Entrance animation (Emil spec) ── */
    @keyframes up {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .a { animation: up 0.55s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .a1 { animation-delay: 40ms; }
    .a2 { animation-delay: 100ms; }
    .a3 { animation-delay: 160ms; }
    .a4 { animation-delay: 220ms; }

    @media (prefers-reduced-motion: reduce) {
      .a { animation: none; }
    }

    @media (max-width: 600px) {
      .topbar { padding: 0 20px; }
      .card { padding: 40px 24px; }
      footer { padding: 0 20px; }
      .data-grid { grid-template-columns: 1fr; }
      .data-cell:nth-child(odd) { border-right: none; }
      .data-cell { border-bottom: 1px solid var(--border); }
      .data-cell:last-child { border-bottom: none; }
    }
  </style>
</head>
<body>
  <div class="shell">

    <header class="topbar">
      <span class="topbar-brand">QMS — Benchmark Studio</span>
      <div class="topbar-right">
        <span class="topbar-clock" id="clock">--:--:--</span>
        <div class="status-pill">
          <div class="status-sq"></div>
          Offline
        </div>
      </div>
    </header>

    <main>
      <div class="card">
        <p class="eyebrow a a1">Service Status</p>

        <h1 class="a a2">
          Portal<br>
          <span class="muted">Suspended.</span>
        </h1>

        <div class="hr a a3"></div>

        <p class="a a3">
          The QMS portal is temporarily offline for maintenance and upgrades. Access will be restored shortly.
        </p>

        <div class="data-grid a a4">
          <div class="data-cell">
            <div class="data-key">Status</div>
            <div class="data-val offline">Offline</div>
          </div>
          <div class="data-cell">
            <div class="data-key">HTTP</div>
            <div class="data-val">503</div>
          </div>
          <div class="data-cell">
            <div class="data-key">System</div>
            <div class="data-val">QMS React</div>
          </div>
          <div class="data-cell">
            <div class="data-key">ETA</div>
            <div class="data-val">TBD</div>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <span id="date">---</span>
    </footer>

  </div>

  <script>
    function pad(n) { return String(n).padStart(2, '0'); }
    function tick() {
      const now = new Date();
      document.getElementById('clock').textContent =
        `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      document.getElementById('date').textContent =
        `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
